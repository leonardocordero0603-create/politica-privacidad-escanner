        d="M35,42 c0,-3.3 2.7,-6 6,-6 h26 c3.3,0 6,2.7 6,6 v38 c0,3.3 -2.7,6 -6,6 h-26 c-3.3,0 -6,-2.7 -6,-6 z" />

