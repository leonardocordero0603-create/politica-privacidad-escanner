        d="M37,43 c0,-2.2 1.8,-4 4,-4 h26 c2.2,0 4,1.8 4,4 v36 c0,2.2 -1.8,4 -4,4 h-26 c-2.2,0 -4,-1.8 -4,-4 z" />

    <!-- POS Screen Glass Area -->
    <path
        fill="#0284C7"
